[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-screwtape"
version = "0.1.0"
description = "LangChain tools for Screwtape.ai: check an agent's payment and catch duplicate invoices before money moves."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["langchain-core>=0.3,<2", "httpx>=0.27"]
keywords = ["langchain", "ai-agents", "agent-payments", "ai-safety", "invoice", "duplicate-invoice"]

[project.urls]
Homepage = "https://screwtape.ai"
Documentation = "https://screwtape.ai/docs/"
Source = "https://github.com/screwtapeai/langchain-screwtape"

[tool.hatch.build.targets.wheel]
packages = ["langchain_screwtape"]
